<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>부산 공영주차장</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="header">
        <h1>🚗 부산 공영주차장</h1>
        <p>부산광역시 공영주차장 정보를 확인할 수 있습니다.</p>
    </header>

    <main class="container">

        <div class="toolbar">
            <button id="loadButton">
                주차장 정보 조회
            </button>

            <span id="status">
                조회 버튼을 눌러주세요.
            </span>
        </div>

        <section id="parkingList" class="parking-list">
            <!-- JavaScript에서 주차장 정보를 표시합니다. -->
        </section>

    </main>

    <script src="app.js"></script>

</body>

</html>
