<!DOCTYPE html>
<html lang="ko">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>부산 공영주차장</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


    <header class="header">

        <h1>
            🚗 부산 공영주차장
        </h1>

        <p>
            부산광역시 공영주차장 실시간 주차 정보를 확인하세요.
        </p>

    </header>


    <main class="container">


        <!-- 조회 영역 -->
        <section class="control-panel">


            <div class="toolbar">

                <button id="loadButton" class="primary-button">
                    🔄 주차장 정보 조회
                </button>

                <span id="status">
                    조회 버튼을 눌러주세요.
                </span>

            </div>


            <!-- 검색 -->
            <div class="filter-area">


                <div class="search-box">

                    <label for="searchInput">
                        주차장 검색
                    </label>

                    <input id="searchInput" type="text" placeholder="주차장명 또는 주소를 입력하세요">

                </div>


                <!-- 구/군 -->
                <div class="filter-box">

                    <label for="districtSelect">
                        지역
                    </label>

                    <select id="districtSelect">

                        <option value="all">
                            전체 지역
                        </option>

                    </select>

                </div>


                <!-- 상태 -->
                <div class="filter-box">

                    <label for="statusSelect">
                        주차 상태
                    </label>

                    <select id="statusSelect">

                        <option value="all">
                            전체 상태
                        </option>

                        <option value="good">
                            🟢 여유
                        </option>

                        <option value="normal">
                            🟡 보통
                        </option>

                        <option value="busy">
                            🔴 혼잡
                        </option>

                        <option value="unknown">
                            ⚪ 정보 없음
                        </option>

                    </select>

                </div>


            </div>


            <!-- 검색 결과 정보 -->
            <div class="result-summary">

                <span id="resultCount">
                    검색 결과 0개
                </span>

            </div>


        </section>

        <!-- 카카오맵 영역 -->
        <section class="map-section">

            <div class="map-header">
                <h2>🗺️ 주차장 지도</h2>
                <span>주차장 위치를 지도에서 확인하세요.</span>
            </div>

            <div id="map"></div>

        </section>

        <!-- 주차장 목록 -->
        <section id="parkingList" class="parking-list">

            <div class="empty">
                주차장 정보 조회 버튼을 눌러주세요.
            </div>

        </section>

    </main>

    <script type="text/javascript"
        src="//dapi.kakao.com/v2/maps/sdk.js?appkey=3ba15aee1736514fae4a8630af29bf36"></script>

    <script src="app.js"></script>

</body>

</html>
